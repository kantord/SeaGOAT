[project]
name = "seagoat"
# The version comes from Cargo.toml (see the comment there)
dynamic = ["version"]
description = "A semantic-code search engine"
authors = [{ name = "Daniel Kantor", email = "git@daniel-kantor.com" }]
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "chromadb>=1.0.0,<2",
    "tqdm>=4.65.0,<5",
    "platformdirs>=4.13.5,<5",
    "click>=8.2.0,<9",
    "pygments>=2.15.1,<3",
    "requests>=2.31.0,<3",
    "psutil>=7.0.0,<8",
    "orjson>=3.9.5,<4",
    "waitress>=3.0.0,<4",
    "chardet>=5.2.0,<6",
    "pyyaml>=6.0.1,<7",
    "jsonschema>=4.19.1,<5",
    "deepmerge>=2.0.0,<3",
    "stop-words>=2018.7.23,<2019",
    "flask>=3.0.0,<4",
    "ollama>=0.6.3,<0.7",
    "openai>=1.0.0,<2",
    "yaspin>=3.5.1,<4",
    "mcp>=1.26.0,<2",
    "packaging>=26.0,<27",
]

[project.scripts]
gt = "seagoat.cli:seagoat"
seagoat = "seagoat.cli:seagoat"
seagoat-server = "seagoat.server:server"
seagoat-mcp = "seagoat.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pre-commit>=4.0.0,<5",
    "pyright>=1.1.314,<2",
    "pytest-watcher>=0.6.3,<0.7",
    "gitpython>=3.1.31,<4",
    "freezegun>=1.2.2,<2",
    "syrupy>=5.0.0,<6",
    "pytest-asyncio>=1.0.0,<2",
    "ipython>=8.14.0,<9",
    "pytest-mock>=3.11.1,<4",
    "pytest-testmon>=2.0.12,<3",
    "mkdocs-material>=9.1.19,<10",
    "pytest-sugar>=1.0.0,<2",
    "pytest-timeout>=2.1.0,<3",
    "psutil>=7.0.0,<8",
    "pytest-cov>=7.1,<8",
    "locust>=2.17.0,<3",
    "ruff>=0.17.1,<0.18",
    "mike>=2.1.0,<3",
]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "3 days"
# Rebuild the native extension when its sources change
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.maturin]
module-name = "seagoat._native"
# Keep the sdist to what building the package needs
exclude = [
    { path = "asciinema/**", format = "sdist" },
    { path = "assets/**", format = "sdist" },
    { path = "docs/**", format = "sdist" },
    { path = "scripts/**", format = "sdist" },
    { path = "tests/**", format = "sdist" },
    { path = "typings/**", format = "sdist" },
    { path = "*.yml", format = "sdist" },
    { path = "*.json", format = "sdist" },
    { path = "locustfile.py", format = "sdist" },
    { path = "uv.lock", format = "sdist" },
]

[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["seagoat"]
exclude = ["**/node_modules", "**/__pycache__" ]
ignore = ["typings"]

reportMissingImports = false
reportMissingTypeStubs = false

pythonVersion = "3.11"
pythonPlatform = "Linux"
strict = []

executionEnvironments = [ { root = "src" } ]

[tool.pytest.ini_options]
timeout = 15

[tool.ruff]
exclude = [
    "typings",
    ".venv"
]

[tool.ruff.lint]
# T20: no print() calls; use logging, or click.echo for CLI output
extend-select = ["T20"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "T201"]
"seagoat/utils/debug.py" = ["T201"]
# Blocking setup (writing files, running git) is fine in async tests
"tests/**" = ["ASYNC"]
