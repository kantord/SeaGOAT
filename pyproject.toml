[project]
name = "seagoat"
version = "1.4.1"
description = "A semantic-code search engine"
authors = [{ name = "Daniel Kantor", email = "git@daniel-kantor.com" }]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "chromadb>=1.0.0,<2",
    "gitpython>=3.1.31,<4",
    "tqdm>=4.65.0,<5",
    "appdirs>=1.4.4,<2",
    "click>=8.2.0,<9",
    "blessed>=1.20.0,<2",
    "pygments>=2.15.1,<3",
    "nest-asyncio>=1.5.6,<2",
    "requests>=2.31.0,<3",
    "setuptools>=84.1,<85",
    "psutil>=7.0.0,<8",
    "orjson>=3.9.5,<4",
    "waitress>=3.0.0,<4",
    "chardet>=5.2.0,<6",
    "pyyaml>=6.0.1,<7",
    "jsonschema>=4.19.1,<5",
    "deepmerge>=2.0.0,<3",
    "stop-words>=2018.7.23,<2019",
    "flask>=3.0.0,<4",
    "ollama>=0.5.0,<0.6",
    "openai>=1.0.0,<2",
    "halo>=0.0.31,<0.0.32",
    "mcp>=1.26.0,<2",
]

[project.scripts]
gt = "seagoat.cli:seagoat"
seagoat = "seagoat.cli:seagoat"
seagoat-server = "seagoat.server:server"
seagoat-mcp = "seagoat.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pre-commit>=4.0.0,<5",
    "pyright>=1.1.314,<2",
    "pytest-watch>=4.2.0,<5",
    "freezegun>=1.2.2,<2",
    "syrupy>=5.0.0,<6",
    "pytest-asyncio>=1.0.0,<2",
    "ipython>=8.14.0,<9",
    "exceptiongroup>=1.1.2,<2",
    "pytest-mock>=3.11.1,<4",
    "pytest-fast-first>=1.0.5,<2",
    "pytest-testmon>=2.0.12,<3",
    "pytest-leaks>=0.3.1,<0.4",
    "mkdocs-material>=9.1.19,<10",
    "markdown-include>=0.8.1,<0.9",
    "pytest-sugar>=1.0.0,<2",
    "pytest-profiling>=1.7.0,<2",
    "pytest-timeout>=2.1.0,<3",
    "psutil>=7.0.0,<8",
    "pytest-cov>=6.0.0,<7",
    "matplotlib>=3.8.0,<4",
    "ipykernel>=6.25.2,<7",
    "jupyterlab-widgets>=3.0.9,<4",
    "pandas>=2.1.1,<3",
    "locust>=2.17.0,<3",
    "pytest-clarity>=1.0.1,<2",
    "flask-basicauth>=0.2.0,<0.3",
    "ruff>=0.12.0,<0.13",
    "mike>=2.1.0,<3",
]
ev = ["seaborn>=0.13.0,<0.14"]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "3 days"
# Rebuild the native extension when its sources change
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.maturin]
module-name = "seagoat._native"
# Keep the sdist to what building the package needs
exclude = [
    { path = "asciinema/**", format = "sdist" },
    { path = "assets/**", format = "sdist" },
    { path = "docs/**", format = "sdist" },
    { path = "scripts/**", format = "sdist" },
    { path = "tests/**", format = "sdist" },
    { path = "typings/**", format = "sdist" },
    { path = "*.yml", format = "sdist" },
    { path = "*.json", format = "sdist" },
    { path = "locustfile.py", format = "sdist" },
    { path = "uv.lock", format = "sdist" },
]

[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["seagoat"]
exclude = ["**/node_modules", "**/__pycache__" ]
ignore = ["typings"]

reportMissingImports = false
reportMissingTypeStubs = false

pythonVersion = "3.11"
pythonPlatform = "Linux"
strict = []

executionEnvironments = [ { root = "src" } ]

[tool.pytest.ini_options]
timeout = 15

[tool.ruff]
exclude = [
    "typings",
    ".venv"
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
