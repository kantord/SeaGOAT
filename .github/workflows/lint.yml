---
name: lint and other checks

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        defaults:
            run:
                shell: bash
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest]
                python-version: ['3.13']

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Python
              id: setup-python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  components: rustfmt, clippy

            - name: Install dependencies
              run: uv sync --locked

            - name: Run pre-commit
              run: |
                  uv run pre-commit run --all-files

            - name: Check Rust code
              run: |
                  cargo fmt --check
                  cargo clippy --all-targets --locked -- -D warnings
                  cargo test --locked

            - name: Check that Python files count towards releases
              # release-plz only counts commits that touch files of the crate
              # (see the comment in Cargo.toml)
              run: |
                  # Not piped into grep -q: under pipefail, grep exiting early
                  # can make the pipeline fail with SIGPIPE
                  cargo package --list --locked --allow-dirty > packaged-files.txt
                  if ! grep -qx 'seagoat/cli.py' packaged-files.txt; then
                      echo "::error::Python files are no longer part of the crate, so release-plz would ignore Python-only changes"
                      exit 1
                  fi
