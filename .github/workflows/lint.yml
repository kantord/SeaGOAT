---
name: lint and other checks

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        defaults:
            run:
                shell: bash
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest]
                python-version: ['3.13']

        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

            - name: Set up Python
              id: setup-python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

            - name: Install Rust
              uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
              with:
                  components: rustfmt, clippy

            - name: Install dependencies
              run: uv sync --locked

            - name: Run pre-commit
              run: |
                  uv run pre-commit run --all-files

            - name: Check Rust code
              run: |
                  cargo fmt --check
                  cargo clippy --all-targets --locked -- -D warnings
                  cargo test --locked

            - name: Check that Python files count towards releases
              # release-plz only counts commits that touch files of the crate
              # (see the comment in Cargo.toml)
              run: |
                  # Not piped into grep -q: under pipefail, grep exiting early
                  # can make the pipeline fail with SIGPIPE
                  cargo package --list --locked --allow-dirty > packaged-files.txt
                  if ! grep -qx 'seagoat/cli.py' packaged-files.txt; then
                      echo "::error::Python files are no longer part of the crate, so release-plz would ignore Python-only changes"
                      exit 1
                  fi
