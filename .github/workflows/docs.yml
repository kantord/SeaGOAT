---
name: docs deployment to github pages
on:
    push:
        branches:
            - main
permissions:
    contents: write
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
              with:
                  fetch-depth: 0 # fetch all history for all branches and tags
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: 3.13
            - name: Install uv
              uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
            - name: Install dependencies
              run: uv sync --locked --no-install-project
            - name: Configure git
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"
            - name: Fetch all history for all branches and tags
              run: git fetch --all
            - name: Deploy docs with Mike
              run: |
                  VERSION=$(uv run semantic-release --noop version --print)
                  # Remove patch version and replace it with 'x'
                  VERSION="${VERSION%.*}.x"
                  uv run --with mike mike deploy --push --update-aliases $VERSION latest
                  uv run --with mike mike set-default --push latest
