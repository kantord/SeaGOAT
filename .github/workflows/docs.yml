---
name: docs deployment to github pages
on:
    push:
        branches:
            - main
    workflow_dispatch:
permissions:
    contents: write
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0 # fetch all history for all branches and tags
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: 3.13
            - name: Install uv
              uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
            - name: Install dependencies
              run: uv sync --locked --no-install-project
            - name: Configure git
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"
            - name: Fetch all history for all branches and tags
              run: git fetch --all
            - name: Deploy docs with Mike
              run: |
                  # The version of the last release: release PRs bump Cargo.toml
                  VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
                  # Remove patch version and replace it with 'x'
                  VERSION="${VERSION%.*}.x"
                  # --no-sync: the docs don't need SeaGOAT itself, so skip building it
                  uv run --no-sync mike deploy --push --update-aliases $VERSION latest
                  uv run --no-sync mike set-default --push latest
