---
name: pytest

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        defaults:
            run:
                shell: bash
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest]
                python-version: ['3.13', '3.14']

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Python
              id: setup-python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install ripgrep
              run: |
                  if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
                    curl -LO https://github.com/BurntSushi/ripgrep/releases/download/13.0.0/ripgrep_13.0.0_amd64.deb
                    sudo dpkg -i ripgrep_13.0.0_amd64.deb
                  elif [ "${{ matrix.os }}" == "windows-latest" ]; then
                    choco install ripgrep
                  elif [ "${{ matrix.os }}" == "macos-latest" ]; then
                    brew install ripgrep
                  fi

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

            - name: Install uv
              uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

            - name: Install dependencies on macOS
              if: runner.os == 'macOS'
              run: |
                  export HNSWLIB_NO_NATIVE=1
                  arch -x86_64 uv sync --locked

            - name: Install dependencies on other OS
              if: runner.os != 'macOS'
              run: |
                  export HNSWLIB_NO_NATIVE=1
                  uv sync --locked

            - name: Run pytest
              run: |
                  uv run pytest . -vvs --timeout=300 --cov seagoat --cov-report=xml

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              # Once is enough; and a Codecov outage must not fail the tests
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
              continue-on-error: true
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
