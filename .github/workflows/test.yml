---
name: pytest

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        defaults:
            run:
                shell: bash
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest]
                python-version: ['3.13', '3.14']

        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

            - name: Set up Python
              id: setup-python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install ripgrep
              run: |
                  if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
                    curl -LO https://github.com/BurntSushi/ripgrep/releases/download/13.0.0/ripgrep_13.0.0_amd64.deb
                    sudo dpkg -i ripgrep_13.0.0_amd64.deb
                  elif [ "${{ matrix.os }}" == "windows-latest" ]; then
                    choco install ripgrep
                  elif [ "${{ matrix.os }}" == "macos-latest" ]; then
                    brew install ripgrep
                  fi

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

            - name: Install uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

            - name: Install dependencies on macOS
              if: runner.os == 'macOS'
              run: |
                  export HNSWLIB_NO_NATIVE=1
                  arch -x86_64 uv sync --locked

            - name: Install dependencies on other OS
              if: runner.os != 'macOS'
              run: |
                  export HNSWLIB_NO_NATIVE=1
                  uv sync --locked

            - name: Run pytest
              run: |
                  uv run pytest . -vvs --timeout=300 --cov seagoat --cov-report=xml

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@bb7467c2bce05781760a0964d48e35e96ee59505 # v5-beta
              if: matrix.os == 'ubuntu-latest'
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
